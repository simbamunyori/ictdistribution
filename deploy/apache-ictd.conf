# Apache in front of ICT Distribution (installed by deploy/server-setup.sh
# as /etc/apache2/sites-available/ictd.conf). certbot --apache copies this
# into an HTTPS site and turns this one into a redirect to HTTPS.
<VirtualHost *:80>
    ServerName ictdistribution.africa
    ServerAlias www.ictdistribution.africa

    # One address for everyone, so passkeys (tied to the exact host) always work.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://ictdistribution.africa%{REQUEST_URI} [R=301,L]

    ProxyRequests Off
    ProxyPreserveHost On
    # The app trusts the first X-Forwarded-For address for the /admin
    # allowlist and rate limits. Drop whatever the visitor sent, so the only
    # address in it is the one Apache adds: the real client.
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Real-IP early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    ProxyPass        / http://127.0.0.1:3100/ timeout=120
    ProxyPassReverse / http://127.0.0.1:3100/

    LimitRequestBody 10485760

    ErrorLog ${APACHE_LOG_DIR}/ictd-error.log
    CustomLog ${APACHE_LOG_DIR}/ictd-access.log combined
</VirtualHost>
