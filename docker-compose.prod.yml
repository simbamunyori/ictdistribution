# Production: the app, PostgreSQL, Redis and the nightly backup.
#
# On the production server (Apache in front, see docs/deploy.md) this file is
# run by deploy/deploy.sh, never by hand:
#   docker compose -p ictd -f docker-compose.prod.yml ...
# The project name "ictd" keeps the database volume the same from one
# release to the next. It shares the server with Cloud Console, so it has
# its own port (3100) and its own network (172.30.20.0/24).
#
# On a server without a web server of its own, add Caddy for automatic
# HTTPS with:  docker compose -p ictd -f docker-compose.prod.yml --profile caddy up -d
services:
  app:
    image: ictd:${RELEASE:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ictd:${POSTGRES_PASSWORD}@db:5432/ictd
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      RELEASE: ${RELEASE:-latest}
    # Only Apache on this server reaches the app.
    ports:
      - "127.0.0.1:3100:3000"
    networks: [ictd]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Database migrations and first-start reference data, run by
  # deploy/deploy.sh before each release starts.
  migrate:
    profiles: [tools]
    image: ictd:${RELEASE:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ictd:${POSTGRES_PASSWORD}@db:5432/ictd
      NODE_ENV: production
    command: ["sh", "-c", "node /migrate/node_modules/prisma/build/index.js migrate deploy && node ops.cjs prestart"]
    networks: [ictd]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ictd
      POSTGRES_DB: ictd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks: [ictd]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ictd -d ictd"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Rate limits and short-lived caches. Nothing in it needs a backup.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [ictd]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The database every night at BACKUP_AT (UTC): an encrypted file in
  # ./backups on the server, and a copy off-site once OFFSITE_S3_BUCKET and
  # its access key are set (any S3-compatible storage).
  backup:
    image: ictd-backup:latest
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    command: ["/backup.sh", "--nightly"]
    networks: [ictd]
    environment:
      DATABASE_URL: postgresql://ictd:${POSTGRES_PASSWORD}@db:5432/ictd
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env}
      BACKUP_AT: ${BACKUP_AT:-23:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_PREFIX: ${OFFSITE_S3_PREFIX:-ictd}
      # rclone reads the off-site storage from these; nothing is written to disk.
      RCLONE_CONFIG_OFFSITE_TYPE: ${OFFSITE_TYPE:-s3}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_S3_REGION:-auto}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./deploy/restore-test.sh:/restore-test.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    networks: [ictd]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

networks:
  ictd:
    ipam:
      config:
        - subnet: 172.30.20.0/24

volumes:
  db-data:
  caddy-data:
  caddy-config:
